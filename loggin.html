<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <a href="index.html" class="absolute top-4 left-4 flex items-center justify-center w-10 h-10 bg-white rounded-full shadow hover:bg-gray-200 transition">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-[#532782]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9.5l9-7 9 7V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z" />
    </svg>
  </a>

  <div class="w-full max-w-sm bg-white rounded-lg shadow-lg p-8">
    <h2 class="text-2xl font-semibold text-gray-800 mb-6 text-center">Login</h2>
    <form id="login-form" class="space-y-4">
      <div>
        <label for="email" class="block text-gray-700 font-medium mb-1">Email</label>
        <input type="email" name="email" id="email" required placeholder="you@example.com" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
      </div>
      <div>
        <label for="password" class="block text-gray-700 font-medium mb-1">Password</label>
        <input type="password" name="password" id="password" required placeholder="Enter your password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
      </div>
      <button type="submit" class="w-full bg-[#532782] text-white font-medium py-2 rounded-lg hover:bg-[#4b1f6f] transition duration-200">Sign In</button>
    </form>
    <p class="mt-4 text-center text-gray-500 text-sm">Forgot your password? <a href="3037200123" class="text-[#532782] hover:underline">text me ill fix it</a></p>
  </div>

  <script>





const SUPABASE_URL = "https://mvjxloioivrwilvctuck.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12anhsb2lvaXZyd2lsdmN0dWNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwMzA5MTksImV4cCI6MjA5ODYwNjkxOX0.pulCaHi1cAh4EmQt7cIN3eKdsKJ0MQxJx_Kzht6Zcb8";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const form = document.getElementById("login-form");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = form.email.value;
  const password = form.password.value;

  const btn = form.querySelector("button");
  btn.disabled = true;
  btn.textContent = "Signing in...";

  const { error } = await client.auth.signInWithPassword({
    email,
    password,
  });

  if (error) {
    alert(error.message);
    btn.disabled = false;
    btn.textContent = "Sign In";
    return;
  }

  // DONE — Supabase handles session automatically
  window.location.href = "messageboard.html";
});

const existingSession = localStorage.getItem("sb_session");

if (existingSession) {
  window.location.href = "messageboard.html";
}
</script>

</body>
</html>
